services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - /shared/local_video/redis:/data

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: sqlite:////data/local_video.db
      DATA_DIR: /data
      MEDIA_DIR: /media
      WORKFLOWS_DIR: /app/comfyui_workflows
    volumes:
      - /shared/local_video/data:/data
      - /shared/local_video/media:/media
      - ./comfyui_workflows:/app/comfyui_workflows:ro
    depends_on:
      - redis

  worker:
    build: .
    restart: unless-stopped
    command: ["arq", "app.workers.movie_agent.WorkerSettings"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: sqlite:////data/local_video.db
      DATA_DIR: /data
      MEDIA_DIR: /media
      WORKFLOWS_DIR: /app/comfyui_workflows
      PYTHONPATH: /app/backend
    volumes:
      - /shared/local_video/data:/data
      - /shared/local_video/media:/media
      - ./comfyui_workflows:/app/comfyui_workflows:ro
    depends_on:
      - redis
      - api
    working_dir: /app/backend

  mcp:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.mcp_server"]
    ports:
      - "8700:8700"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: sqlite:////data/local_video.db
      DATA_DIR: /data
      MEDIA_DIR: /media
      WORKFLOWS_DIR: /app/comfyui_workflows
      PYTHONPATH: /app/backend
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8700"
    volumes:
      - /shared/local_video/data:/data
      - /shared/local_video/media:/media
      - ./comfyui_workflows:/app/comfyui_workflows:ro
    depends_on:
      - redis
      - api
    working_dir: /app/backend
