workflow: ltx23_flf2v.json
description: >
  LTX-2.3 (22B distilled FP8) FLF2V graph.
  LTX-2 19B first+last frame → video (single-graph FLF for keyframes / movie).
  Packaged from the working Comfy-Org FLF blueprint (LTX-2 19B FP8 + Gemma FP4).
  Frame rule: 8n+1 (e.g. 33). Host needs ComfyMathExpression + ResizeImageMaskNode.
model_files:
  - models/checkpoints/ltx-2.3-22b-distilled-fp8.safetensors
  - models/text_encoders/gemma_3_12B_it_fp4_mixed.safetensors
fields:
  positive_prompt: {node: "222", input: text}
  negative_prompt: {node: "217", input: text}
  seed: {node: "196", input: noise_seed}
  num_frames: {node: "198", input: value}
  width: {node: "215", input: value}
  height: {node: "216", input: value}
  fps:
    node: "205"
    input: value
    also:
      - {node: "218", input: fps}
  filename_prefix: {node: "9003", input: filename_prefix}
  start_image: {node: "9001", input: image, upload: true}
  end_image: {node: "9002", input: image, upload: true}
