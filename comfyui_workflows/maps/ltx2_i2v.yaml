workflow: ltx2_i2v.json
description: >
  LTX-2 (19B FP8) I2V graph.
  LTX-2 19B image-to-video (start-locked). Same distilled single-pass topology as
  ltx_flf2v with start image fed as both first and last guide (proven I2V path).
  Frame rule: 8n+1.
model_files:
  - models/checkpoints/ltx-2-19b-dev-fp8.safetensors
  - models/text_encoders/gemma_3_12B_it_fp4_mixed.safetensors
fields:
  positive_prompt: {node: "222", input: text}
  negative_prompt: {node: "217", input: text}
  seed: {node: "196", input: noise_seed}
  num_frames: {node: "198", input: value}
  width: {node: "215", input: value}
  height: {node: "216", input: value}
  fps:
    node: "205"
    input: value
    also:
      - {node: "218", input: fps}
  filename_prefix: {node: "9003", input: filename_prefix}
  start_image:
    node: "9001"
    input: image
    upload: true
    also:
      - {node: "9002", input: image}
