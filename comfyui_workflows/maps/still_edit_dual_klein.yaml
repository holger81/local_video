model_files:
  - models/diffusion_models/flux-2-klein-base-9b-fp8.safetensors
  - models/text_encoders/qwen_3_8b_fp8mixed.safetensors
  - models/vae/full_encoder_small_decoder.safetensors
fields:
  start_image: {node: "76", input: image}
  ref_image: {node: "81", input: image}
  positive_prompt: {node: "92:113", input: text}
  negative_prompt: {node: "92:87", input: text}
  seed: {node: "92:105", input: noise_seed}
  steps: {node: "92:115", input: steps}
  cfg: {node: "92:114", input: cfg}
  filename_prefix: {node: "94", input: filename_prefix}
